name: An idea
description: Something Vertcut could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Vertcut to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why — what are you trying to get done?
      description: The situation behind the idea helps more than the solution itself.
